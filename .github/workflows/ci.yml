name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# cactus uses Go's built-in crypto/mldsa and declares `go 1.27` in
# go.mod, so it must be built with a Go 1.27 toolchain. GOTOOLCHAIN=local
# keeps the go command from downloading a different toolchain than the
# one setup-go installed.
env:
  GO_VERSION: '1.27'
  GOTOOLCHAIN: local

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # setup-go caches the module and build caches itself, keyed on
      # go.sum, so no separate actions/cache step is needed.
      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Toolchain version
        run: go version

      - name: Vet
        run: make vet

      - name: Build
        run: make build

      - name: Test (race)
        run: go test -race -count=1 ./...

      - name: Integration tests (race)
        run: make integration

      # The stress test is build-tagged, so the steps above never compile
      # it. Vet it here so a break is caught on the pull request rather
      # than by the nightly Stress workflow. Running it is that
      # workflow's job.
      - name: Vet stress-tagged tests
        run: go vet -tags=stress ./integration/...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      # Formatting (gofmt + goimports) is checked here too, via the
      # formatters enabled in .golangci.yml. v2.13.0 is the minimum that
      # can type-check a Go 1.27 module.
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
